name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Gateway, viewer, kit, protocol, TypeScript SDK and ROS 2 bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm --workspace @marionette/viewer run build
      - run: python3 -m unittest discover consumers/ros2
      - name: The Python SDK's bundled gateway is up to date
        run: |
          python3 sdk/python/scripts/sync_gateway.py
          git diff --exit-code sdk/python/src/marionette/_gateway || { echo "Run python3 sdk/python/scripts/sync_gateway.py and commit the result."; exit 1; }

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -e "sdk/python[dev,gateway]"
      - run: python -m pytest sdk/python
