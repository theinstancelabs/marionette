<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Marionette</title>
<!--
  Marionette's default phone screen, built on the screen kit (packages/kit, docs/SCREEN-KIT.md). The gateway puts
  the kit inline and sends this document to the app, which shows it full screen and provides window.Marionette.
  Every control is looked up in the gateway config by its action, so a custom config still renders: known actions
  get their place (Stop, the hold pad, Drive base, calibration), and anything else becomes a row. Copy this file and
  point MARIONETTE_HTML_FILE at it to make your own screen; preview it at http://localhost:8787/screen.
-->
<link rel="stylesheet" href="marionette-kit.css">
<script src="marionette-kit.js"></script>
<style>
.app{min-height:100vh;display:flex;flex-direction:column;padding-top:var(--top)}
.pad-x{padding:0 22px}

/* Headline, and the robot this screen talks to */
.state{font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-.015em;margin:18px 0 0}
.state.moving{color:var(--blue)}.state.stopped{color:var(--red)}
.robot{display:flex;align-items:center;gap:7px;margin:8px 0 0 2px;font-size:15px;color:var(--ink2)}
.robot b{font-weight:600;color:var(--ink)}

/* Pose, and what the stick sends */
.pose{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule)}
.pose>div{padding:10px 0 12px 2px}
.pose small{display:block;font-size:14px;color:var(--ink2)}
.pose b{font-size:26px;font-weight:500}
.pose .mk-bar{margin:8px 12px 0 0}
.pose.two{grid-template-columns:repeat(2,1fr);margin-top:16px}
.cam{margin-top:16px}
.rows{margin-top:10px}

/* Drive base: a spring-return stick between the turn buttons, then what it sends and the speed limit */
.drive{margin-top:18px;border-top:1.5px solid var(--ink);padding-top:12px}
.drive-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.drive-head h2{margin:0;font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.drive-state{font-size:15px;color:var(--ink2)}
.drive-state.live{color:var(--blue);font-weight:600}.drive-state.dropped{color:var(--red);font-weight:600}
.drive .mk-note{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drive-grid{display:grid;grid-template-columns:64px minmax(0,220px) 64px;justify-content:space-between;gap:12px;margin-top:14px}

/* Dock: the hold-to-move pad and other hold buttons, filled once the gateway reports the hold, red if it let go */
.spacer{flex:1;min-height:24px}
.dock{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 16px calc(14px + var(--bottom));background:linear-gradient(rgba(250,250,246,0),var(--paper) 28%)}
.pad{flex:1;height:100px;border-radius:22px;border:2.5px solid var(--blue);background:#fff;color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:20px;touch-action:none}
.pad small{font-weight:400;font-size:14px;color:var(--ink2);margin-top:2px}
.pad[data-state=pending]{background:var(--blue-wash)}
.pad[data-state=held]{background:var(--blue);color:#fff}
.pad[data-state=held] small{color:#dfe6f7}
.pad[data-state=dropped]{border-color:var(--red);color:var(--red);background:#fff}
.hold{width:100px;height:100px;flex:none;border-radius:22px;border:1.5px solid var(--ink);background:#fff;font-weight:500;font-size:16px;touch-action:none;padding:0 6px}
.hold[data-state=pending]{background:var(--paper2)}
.hold[data-state=held]{background:var(--ink);color:var(--paper)}
.hold[data-state=dropped]{border-color:var(--red);color:var(--red)}
.hold.turn{width:auto;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;line-height:1.2;padding:0 4px}
.hold.turn b{font-size:28px;font-weight:400;line-height:1}

/* Desktop preview: show a phone-width column */
@media (hover:hover) and (pointer:fine) and (min-width:600px){
  html,body{background-color:#e9ebe6}
  .app{max-width:430px;margin:0 auto;box-shadow:0 0 0 1px var(--rule);background-color:var(--paper);background-image:var(--paper-grid);background-size:24px 24px}
  :root{--mk-stop-right:calc(50% - 215px + 16px)}
}
/* A phone on its side, or an iPad: two columns. What the phone and the robot are doing on the left, with the pad
   under it for the left thumb; the drive base and the settings on the right. */
@media (hover:none) and (min-width:600px){
  .app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:12px;padding-left:var(--left);padding-right:var(--right)}
  .app>.mk-strip,.app>.mk-banner{grid-column:1/-1}
  .lead{grid-column:1;grid-row:3;align-self:start;position:sticky;top:0;max-height:100vh;overflow-y:auto;padding-bottom:calc(132px + var(--bottom))}
  .side{grid-column:2;grid-row:3;padding-bottom:calc(24px + var(--bottom))}
  .spacer{display:none}
  .dock{position:fixed;left:var(--left);bottom:0;width:calc((100% - var(--left) - var(--right) - 12px) / 2)}
  .drive-grid{justify-content:center;column-gap:28px}
  :root{--mk-toast-bottom:calc(24px + var(--bottom))}
}
/* A phone on its side is short: the camera comes before the pose numbers, so it shows above the pad. */
@media (hover:none) and (min-width:600px) and (max-height:500px){
  .lead{display:flex;flex-direction:column}.lead .pose{order:1}
  .state{font-size:26px;margin-top:4px}
  .pose{margin-top:10px}.pose>div{padding:6px 0 8px 2px}.pose b{font-size:22px}
  .cam{margin-top:10px}
  .pad,.hold{height:76px}.hold{width:88px}
  .dock{padding-top:8px;padding-bottom:calc(8px + var(--bottom))}
  .lead{padding-bottom:calc(100px + var(--bottom))}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header id="strip"></header>
  <div id="stop-banner" hidden></div>
  <section class="pad-x lead">
    <h1 class="state" id="state">Connecting…</h1>
    <p class="mk-note" id="state-note"></p>
    <p class="robot" id="robot" hidden><i class="mk-dot" id="robot-dot"></i><span><b id="robot-name"></b><span id="robot-state"></span></span></p>
    <div class="pose" aria-label="Phone position in millimetres">
      <div><small>forward</small><b id="pose-x">0</b><span class="mk-bar"><i id="bar-x" style="background:var(--red)"></i></span></div>
      <div><small>left</small><b id="pose-y">0</b><span class="mk-bar"><i id="bar-y" style="background:var(--green)"></i></span></div>
      <div><small>up</small><b id="pose-z">0</b><span class="mk-bar"><i id="bar-z" style="background:var(--blue)"></i></span></div>
    </div>
    <figure class="cam" id="cam" hidden></figure>
  </section>
  <section class="pad-x side">
    <section class="drive" id="drive" aria-label="Drive base" hidden></section>
    <div class="rows" id="rows"></div>
  </section>
  <div class="spacer"></div>
  <footer class="dock" id="dock"></footer>
</div>
<script>
(() => {
  const K = window.MarionetteKit; const { h, setText, control, byId } = K;
  // Every control is found by its action, so a different layout still gets a working screen.
  const ACTION = {
    deadman: 'teleop.deadman', estop: 'safety.estop',
    start: 'calibration.start', capture: 'calibration.capture', cancel: 'calibration.cancel',
    check: 'calibration.check', origin: 'calibration.captureOrigin', clear: 'calibration.reset',
    drive: 'base.drive', turnLeft: 'base.turnLeft', turnRight: 'base.turnRight', speedLimit: 'base.speedLimit',
  };
  const REASON_NOTES = { excessiveMotion: 'move a little slower', insufficientFeatures: 'point the camera at something with texture', interrupted: 'tracking was interrupted', relocalizing: 'hold still for a moment', initializing: 'move the phone gently to start', synthetic: 'simulated motion, not a real pose' };
  const $ = id => document.getElementById(id);
  // A bar from the middle: fraction is -50..50 (% of the bar).
  const fill = (bar, fraction) => { bar.style.left = (fraction < 0 ? 50 + fraction : 50) + '%'; bar.style.width = Math.abs(fraction) + '%'; };

  K.strip($('strip'));
  const stop = K.stop({ action: ACTION.estop, banner: $('stop-banner') });
  const calibration = K.calibration();
  K.cameras($('cam'));

  /* ---------- Headline: most urgent first ---------- */
  // "the left arm", from whatever the arm control is set to.
  function armWord() { const c = control('arm.select'); const o = c && c.type === 'select' && c.options.find(x => x.value === c.value); return o ? 'the ' + o.label.toLowerCase() : 'the arm'; }
  // No gateway, this phone's Stop, no pose at all, then the pad, then rough tracking.
  function renderHeadline() {
    const c = K.config(), t = K.latest('tracking'), conn = K.latest('connection'); const pad = K.holdState(control(ACTION.deadman)); const drive = K.liveState(control(ACTION.drive));
    const rough = t && t.state !== 'normal' ? (REASON_NOTES[t.reason] || REASON_NOTES[t.state] || 'the pose may be rough until tracking recovers') : '';
    let title = c ? 'Ready' : 'Connecting…', tone = '', note = control(ACTION.deadman) ? 'hold the pad to move ' + armWord() : '', bad = false;
    if (conn && conn.state === 'disconnected') { title = 'Gateway lost'; note = conn.reason || 'reconnect to keep going'; bad = true; }
    else if (conn && conn.state === 'reconnecting') { title = 'Reconnecting…'; note = conn.reason || 'everything was let go; touch it again once it’s back'; bad = true; }
    else if (c && c.phone && c.phone.connected === false) { title = c.phone.name + ' is offline'; note = 'showing its last state until it reconnects'; bad = true; }
    else if (stop.isOn()) { title = 'Stopped'; tone = 'stopped'; note = 'reset Stop when it’s safe to carry on'; bad = true; }
    else if (t && (t.message || t.state === 'unavailable')) { title = 'No tracking'; note = t.message || 'the pose can’t be trusted until tracking returns'; bad = true; }
    else if (pad === 'dropped') { title = 'Hold dropped'; note = 'the gateway stopped hearing the pad; let go and press again'; bad = true; }
    else if (drive === 'dropped') { title = 'Drive dropped'; note = 'let go of the stick and touch it again'; bad = true; }
    else if (pad !== 'idle') { title = pad === 'held' ? 'Holding' : 'Holding…'; tone = 'moving'; note = pad === 'pending' ? 'waiting for the gateway' : rough || 'release the pad to let go'; bad = !!rough; }
    else if (drive !== 'idle') { title = drive === 'live' ? 'Driving' : 'Driving…'; tone = 'moving'; note = drive === 'pending' ? 'waiting for the gateway' : 'let go of the stick to stop'; }
    else if (t && t.state !== 'normal') { title = t.state === 'initializing' ? 'Starting up' : 'Tracking ' + (t.state === 'limited' ? 'limited' : t.state); note = rough; }
    else if (c && c.calibration.status === 'capturing') { title = 'Calibrating'; note = 'finish or cancel it in the calibration sheet'; }
    setText($('state'), title); $('state').className = 'state ' + tone;
    setText($('state-note'), note); $('state-note').className = 'mk-note' + (bad ? ' mk-bad' : '');
  }
  // The robot whose screen this is (or the first one connected): its name, and whether it still answers.
  K.robot(r => {
    $('robot').hidden = !r; if (!r) return;
    setText($('robot-name'), r.name); setText($('robot-state'), r.offline ? ' · offline' : r.stale ? ' · not answering' : '');
    $('robot-dot').className = 'mk-dot ' + (r.offline ? 'mk-bad' : r.stale ? 'mk-warn' : 'mk-good');
  });

  /* ---------- Pose, in millimetres in the operator frame ---------- */
  function renderPose() {
    const p = K.latest('pose'); const v = p ? p.position : { x: 0, y: 0, z: 0 };
    for (const axis of ['x', 'y', 'z']) { const n = K.mm(v[axis]); setText($('pose-' + axis), K.signed(n)); fill($('bar-' + axis), K.clamp(n / 250, -1, 1) * 50); }
  }
  let posePending = false;
  K.on('pose', () => { if (posePending) return; posePending = true; requestAnimationFrame(() => { posePending = false; renderPose(); }); });

  /* ---------- Rows: every control without a fixed place ---------- */
  const PLACED = new Set([ACTION.deadman, ACTION.estop, ACTION.start, ACTION.capture, ACTION.cancel, ACTION.check, ACTION.origin, ACTION.clear]);
  // With a drive stick, the turn buttons and the speed limit join it in the Drive base section; without one they are ordinary controls.
  const driveGroup = () => { const stick = control(ACTION.drive); if (!stick || stick.type !== 'joystick') return [];
    const turn = action => { const c = control(action); return c && c.type === 'button' && c.hold ? c : undefined; }; const speed = control(ACTION.speedLimit);
    return [stick, turn(ACTION.turnLeft), turn(ACTION.turnRight), speed && speed.type === 'slider' ? speed : undefined]; };
  const inDrive = c => driveGroup().includes(c);
  // The dock takes the deadman pad and up to two other hold buttons; any more get rows.
  const dockedHolds = () => K.config().controls.filter(c => c.type === 'button' && c.hold && c.action !== ACTION.deadman && !inDrive(c)).slice(0, 2);
  const rowParts = K.group(); let rowsKey = '';
  function renderRows() {
    const c = K.config(); if (!c) return;
    const docked = dockedHolds(); const listed = c.controls.filter(x => !PLACED.has(x.action) && !docked.includes(x) && !inDrive(x));
    const key = JSON.stringify([listed.map(x => [x.id, x.type, x.label, x.options, x.min, x.max, x.step]), calibration.available()]);
    if (key !== rowsKey) {
      rowsKey = key; rowParts.dispose();
      $('rows').replaceChildren(...(calibration.available() ? [calibration.row({ group: rowParts })] : []), ...listed.map(x => K.controlRow(x, { group: rowParts })),
        h('div', { class: 'mk-row' }, h('span', { class: 'mk-mono', id: 'gateway-row' }), h('button', { type: 'button', class: 'mk-btn', onclick: () => window.Marionette.disconnect() }, 'Disconnect')));
    }
    const conn = K.latest('connection'); setText($('gateway-row'), conn ? conn.gateway : '');
  }

  /* ---------- Drive base: the stick between the turn buttons, what it sends, and the speed limit ---------- */
  const driveParts = K.group(); let driveKey = '';
  const readCell = (word, id, color) => h('div', {}, h('small', {}, word), h('b', { id }, '0.00'), h('span', { class: 'mk-bar' }, h('i', { id: id + '-bar', style: 'background:' + color })));
  function showDrive(v) { for (const [id, n] of [['drive-x', v.x], ['drive-y', v.y]]) { setText($(id), K.signed2(n)); fill($(id + '-bar'), K.clamp(n, -1, 1) * 50); } }
  function renderDrive() {
    if (!K.config()) return;
    const [drive, left, right, speed] = driveGroup(); const section = $('drive');
    const key = JSON.stringify([drive && [drive.id, drive.label], [left, right].map(x => x && [x.id, x.label]), speed && [speed.id, speed.label, speed.min, speed.max, speed.step, speed.unit]]);
    if (key !== driveKey) {
      driveKey = key; driveParts.dispose(); section.replaceChildren(); section.hidden = !drive;
      if (drive) {
        const turn = (x, glyph) => (x ? K.hold(h('button', { type: 'button', class: 'hold turn' }, h('b', { 'aria-hidden': 'true' }, glyph), x.label), { controlId: x.id, group: driveParts }).el : h('span'));
        section.append(
          h('div', { class: 'drive-head' }, h('h2', {}, 'Drive base'), h('span', { class: 'drive-state', id: 'drive-state', role: 'status' })),
          h('p', { class: 'mk-note', id: 'drive-note' }),
          h('div', { class: 'drive-grid' }, turn(left, '↺'), K.stick(null, { action: ACTION.drive, group: driveParts, label: drive.label, edges: ['forward', 'back', 'left', 'right'], onMove: showDrive }).el, turn(right, '↻')),
          h('div', { class: 'pose two', 'aria-label': 'What the stick is sending, from −1 to 1' }, readCell('forward', 'drive-x', 'var(--red)'), readCell('left', 'drive-y', 'var(--green)')),
          speed ? K.controlRow(speed, { group: driveParts }) : '');
        showDrive({ x: 0, y: 0 });
      }
    }
    renderDriveState();
  }
  function renderDriveState() {
    const head = $('drive-state'); if (!head) return;
    const state = K.liveState(control(ACTION.drive)); const turning = [ACTION.turnLeft, ACTION.turnRight].map(control).find(c => K.holdState(c) === 'held');
    const [text, note] = { idle: turning ? [turning.label.replace(/^Turn/, 'Turning'), 'let go to stop turning'] : ['', 'touch the stick and drag, let go to stop'], pending: ['Sending…', 'waiting for the gateway'], live: ['Driving', 'let go to stop'], dropped: ['Dropped', 'let go and touch it again'] }[state];
    setText(head, text); head.className = 'drive-state ' + (state === 'idle' && turning ? 'live' : state);
    setText($('drive-note'), note); $('drive-note').className = 'mk-note' + (state === 'dropped' ? ' mk-bad' : '');
  }

  /* ---------- Dock: the hold-to-move pad and other hold buttons ---------- */
  const dockParts = K.group(); let dockKey = '';
  const PAD_TEXT = { pending: ['Holding…', 'waiting for the gateway'], held: ['Holding', 'release to let go'], dropped: ['Hold dropped', 'let go and press again'] };
  function renderDock() {
    if (!K.config()) return;
    const deadman = control(ACTION.deadman); const holds = dockedHolds(); const dock = $('dock');
    const key = JSON.stringify([deadman && [deadman.id, deadman.label], holds.map(x => [x.id, x.label])]);
    if (key !== dockKey) {
      dockKey = key; dockParts.dispose(); dock.replaceChildren();
      if (deadman) {
        const label = h('span'), sub = h('small');
        const showPad = state => { const [main, small] = PAD_TEXT[state] || [deadman.label, 'release to let go']; setText(label, main); setText(sub, small); };
        dock.append(K.hold(h('button', { type: 'button', class: 'pad' }, label, sub), { action: ACTION.deadman, group: dockParts, onState: showPad }).el);
      }
      for (const x of holds) dock.append(K.hold(h('button', { type: 'button', class: 'hold' }, x.label), { controlId: x.id, group: dockParts }).el);
    }
    dock.hidden = !deadman && !holds.length;
  }

  /* ---------- Bridge wiring ---------- */
  K.on('config', () => { renderRows(); renderDrive(); renderDock(); renderHeadline(); });
  K.on('connection', () => { renderRows(); renderHeadline(); });
  K.on('tracking', renderHeadline);
  K.on('touch', () => { renderDriveState(); renderHeadline(); });
  // Gateway replies with no other home (calibration's own go to its sheet) are shown as a toast.
  K.on('status', m => { if (calibration.handles(m) || m.message === 'Connected to Marionette gateway') return; K.toast(m.message); });
})();
</script>
</body>
</html>
