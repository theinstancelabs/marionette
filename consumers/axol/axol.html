<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Axol</title>
<!--
  The Axol phone screen. The gateway sends this document to the Marionette app, which shows
  it full screen and provides window.Marionette; the gateway also serves it at /screen for a
  desktop browser. The block below declares the controls and cameras; the consumer on Axol
  reads them, and sends robot state
  back as status messages (see consumers/axol/README.md). Built on Marionette's default screen;
  its sliders, drive stick and holds use the same streaming primitives.
-->
<script type="application/json" id="marionette-config">
{
  "controls": [
    { "id": "deadman", "type": "button", "label": "Hold to move", "action": "teleop.deadman", "tone": "accent", "hold": true },
    { "id": "estop", "type": "toggle", "label": "Stop", "action": "safety.estop", "value": false },
    { "id": "arm", "type": "select", "label": "Arm", "action": "arm.select", "value": "left", "options": [{ "label": "Left arm", "value": "left" }, { "label": "Right arm", "value": "right" }] },
    { "id": "cameras", "type": "select", "label": "Cameras", "action": "camera.view", "value": "head", "options": [{ "label": "Head", "value": "head" }, { "label": "Both wrists", "value": "wrists" }, { "label": "Left wrist", "value": "left" }, { "label": "Right wrist", "value": "right" }, { "label": "All three", "value": "all" }] },
    { "id": "scale", "type": "slider", "label": "Motion scale", "action": "teleop.translationScale", "value": 1, "min": 0.25, "max": 3, "step": 0.05, "unit": "×" },
    { "id": "grip", "type": "slider", "label": "Gripper", "action": "gripper.set", "value": 0, "min": 0, "max": 1, "step": 0.01 },
    { "id": "drive", "type": "joystick", "label": "Drive", "action": "base.drive", "value": { "x": 0, "y": 0 } },
    { "id": "turn-left", "type": "button", "label": "Turn left", "action": "base.turnLeft", "hold": true },
    { "id": "turn-right", "type": "button", "label": "Turn right", "action": "base.turnRight", "hold": true },
    { "id": "lift-up", "type": "button", "label": "Raise lift", "action": "lift.up", "hold": true },
    { "id": "lift-down", "type": "button", "label": "Lower lift", "action": "lift.down", "hold": true },
    { "id": "speed-limit", "type": "slider", "label": "Speed limit", "action": "base.speedLimit", "value": 50, "min": 0, "max": 100, "step": 1, "unit": "%" },
    { "id": "reset-left", "type": "button", "label": "Reset left arm", "action": "arm.resetLeft" },
    { "id": "reset-right", "type": "button", "label": "Reset right arm", "action": "arm.resetRight" },
    { "id": "calibration-start", "type": "button", "label": "Start calibration", "action": "calibration.start", "tone": "accent" },
    { "id": "calibration", "type": "button", "label": "Capture calibration step", "action": "calibration.capture", "tone": "accent" },
    { "id": "capture-origin", "type": "button", "label": "Set origin here", "action": "calibration.captureOrigin", "tone": "accent" },
    { "id": "calibration-cancel", "type": "button", "label": "Cancel calibration", "action": "calibration.cancel" },
    { "id": "reset-origin", "type": "button", "label": "Reset calibration", "action": "calibration.reset" },
    { "id": "calibration-check", "type": "button", "label": "Validate calibration", "action": "calibration.check" }
  ],
  "cameraStreams": [
    { "id": "head", "label": "Head", "url": "axol://head", "status": "live" },
    { "id": "left", "label": "Left wrist", "url": "axol://left", "status": "live" },
    { "id": "right", "label": "Right wrist", "url": "axol://right", "status": "live" }
  ],
  "cameraViews": [
    { "id": "head", "label": "Head", "streams": ["head"] },
    { "id": "wrists", "label": "Both wrists", "streams": ["left", "right"] },
    { "id": "left", "label": "Left wrist", "streams": ["left"] },
    { "id": "right", "label": "Right wrist", "streams": ["right"] },
    { "id": "all", "label": "All three", "streams": ["head", "left", "right"] }
  ]
}
</script>
<style>
:root{
  --paper:#fafaf6;--paper2:#f2f3ee;--grid:#e6ebf2;--ink:#2e3033;--ink2:#6b6f73;--rule:#cfd3d6;
  --blue:#2f53b5;--blue-wash:#e9eef9;--red:#cf3f35;--green:#3f7d4e;--hi:#f6e36b;
  --sans:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
  --hand:"Kalam","Noteworthy","Bradley Hand","Segoe Print",cursive;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.4 var(--sans);font-variant-numeric:tabular-nums;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible,.stick:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
/* One screen, no modes: everything an operator touches is visible at once on a portrait phone. */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:var(--top);padding-bottom:var(--bottom)}

/* Status strip: who this is and its tracking, More, and the floating Stop. While Stop is on, the banner takes the chips' place. */
.strip{display:flex;align-items:center;gap:5px;min-height:70px;padding:0 82px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;min-width:0;flex:0 1 auto;padding:0 9px;border-radius:15px;background:#fff;border:1px solid var(--rule);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.dot.good{background:var(--green)}.dot.warn{background:#c8a43a}.dot.bad{background:var(--red)}
/* Which phone this is, in the color the viewer draws it in. */
.chip.me{font-weight:600;flex:0 0 auto}.chip.me .dot{width:10px;height:10px}.chip.me.off{color:var(--ink2);font-weight:400}
.chip.more{flex:none;margin-left:auto;height:44px;border-radius:22px;padding:0 12px;color:var(--blue);font-weight:500;font-size:14px;cursor:pointer}
.rule{position:fixed;z-index:22;top:0;left:0;right:0;height:4px;pointer-events:none}
.stop{position:fixed;z-index:20;top:calc(var(--top) + 6px);right:12px;width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;font-weight:600;font-size:15px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--red);touch-action:none}
.stop:active{transform:scale(.96)}
/* On: pressed in and darker, so it reads as latched on this phone even without the banner. */
.stop[aria-pressed=true]{background:#a3271f;box-shadow:0 0 0 3px var(--paper),0 0 0 5px #a3271f,inset 0 3px 8px rgba(0,0,0,.35)}
.banner{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding:2px 2px 2px 12px;border:2px solid var(--red);border-radius:12px;background:#fff}
.banner b{color:var(--red);font-weight:600;font-size:15px;white-space:nowrap}
.banner button{margin-left:auto;flex:none;height:44px;padding:0 10px;border-radius:9px;border:1.5px solid var(--red);color:var(--red);font-weight:600;font-size:15px;white-space:nowrap}

/* Segmented controls: the arm, and the camera view picker. */
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;min-width:0;min-height:44px;padding:0 6px;font-size:15px;border-left:1px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg button:disabled{color:var(--ink2)}

/* Headline and robot state: one line of state, a note of up to two lines, then the tags. Fixed height, so nothing below moves. */
.pad-x{padding:0 12px}
.state{font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state.moving{color:var(--blue)}.state.stopped{color:var(--red)}
.note{font-family:var(--hand);color:var(--blue);font-size:15px;line-height:18px;height:36px;margin:1px 0 0 1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note.bad{color:var(--red)}
.robot{display:flex;flex-wrap:nowrap;gap:6px;margin-top:4px;height:22px;overflow:hidden}
.tag{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;border:1px solid var(--rule);background:#fff;font-size:12px;white-space:nowrap}
.tag.sim{background:var(--hi);border-color:#d8c64e;font-weight:600}
.tag.moving{border-color:var(--blue);color:var(--blue)}
.tag.bad{border-color:var(--red);color:var(--red);font-weight:600}
.tag.warn{border-color:#c8a43a;color:#7d6400}
.tag.ok{color:var(--green)}
button.tag{cursor:pointer}

/* Camera */
/* One pane per stream in the view this phone picked, side by side and never cropped. With
   several streams, a tap stacks them full width. */
.cam{position:relative;display:grid;grid-template-columns:repeat(var(--panes,1),minmax(0,1fr));gap:1.5px;margin:6px 0 0;border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);overflow:hidden}
.cam[role=button]{cursor:zoom-in}
.cam.big{grid-template-columns:minmax(0,1fr);cursor:zoom-out}
/* Three streams: the first (the head) large on the left, the other two stacked beside it. */
.cam.trio:not(.big){grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:auto auto}
.cam.trio:not(.big) .pane:first-child{grid-row:1 / span 2;aspect-ratio:auto}
.pane{position:relative;min-width:0;aspect-ratio:16/9;background:var(--paper2)}
.pane img{display:block;width:100%;height:100%;object-fit:contain;background:var(--ink)}
.pane figcaption{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:7px}
.cam[role=button]:not(.big) .pane figcaption{left:5px;bottom:5px;font-size:11px;padding:2px 6px}
.pane .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 10px;color:var(--ink2);font-size:14px;line-height:1.25}
.cam[role=button]:not(.big) .pane .empty{font-size:12px}
/* The camera view picker sits right under the panes, compact. Labels may wrap to two lines. */
.views{margin-top:6px}
.views button{min-height:36px;height:36px;padding:0 3px;font-size:12px;line-height:1.1}

/* Rows in the More sheet: calibration, the arm resets, any other controls, and the gateway */
.rows{margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:8px 0;border-bottom:1px solid var(--rule)}
.row.stack{display:block}
.row.stack .row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.row .val{color:var(--ink2)}
.row.link{width:100%;text-align:left}
.row.link .val::after{content:" ›";color:var(--ink2)}
.ok{color:var(--green)!important}.bad{color:var(--red)!important}
.switch{position:relative;flex:none;width:52px;height:32px;border-radius:16px;background:var(--rule);transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked=true]{background:var(--blue)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--blue)}
select{width:100%;min-height:44px;font:inherit;border:1.5px solid var(--ink);border-radius:10px;background:#fff;padding:0 10px;color:var(--ink)}
.row-btn{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;font-weight:500}
.row-btn.danger{border-color:var(--red);color:var(--red)}
.row-btn.pending{background:var(--paper2)}
.row-btn.held{background:var(--ink);color:var(--paper)}
.row-btn.dropped{border-color:var(--red);color:var(--red)}
.row-btn.wide{width:100%}
.row-note{margin:6px 0 0;font-size:14px;color:var(--ink2)}
.row-btn small{font-weight:400;color:var(--ink2)}
.mono{font-family:var(--mono);font-size:15px}

/* Controls: the arm on the left thumb, the base on the right, filling the rest of the screen. The pad and the
   stick take whatever height is left; everything else is a fixed 44 px row. */
.controls{flex:1 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 12px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col .seg button{font-size:14px;padding:0 4px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.key{height:44px;min-width:0;border-radius:12px;border:1.5px solid var(--ink);background:#fff;font-weight:500;font-size:13px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;text-align:center}
.key b{font-weight:400;font-size:13px}
.key:active:not(:disabled){background:var(--paper2)}
.key:disabled{border-color:var(--rule);color:var(--ink2);background:var(--paper2)}
/* Turn and lift holds: the arrow over the label, so both fit on one line at any width. */
.hold-key{touch-action:none;flex-direction:column;gap:1px}
.hold-key b{font-size:12px;line-height:12px}
/* Hold buttons show what the gateway knows: filled once it reports the hold, red if it let go while still pressed. */
.key.pending{background:var(--paper2)}
.key.held{background:var(--ink);color:var(--paper)}
.key.dropped{border-color:var(--red);color:var(--red)}
/* A slider: its label and value on one line, the slider under them. */
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:16px 28px;row-gap:2px;align-items:center;column-gap:6px;font-size:13px}
.setting span{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setting output{grid-column:2;grid-row:1;text-align:right;font-weight:500}
.setting input{grid-column:1/-1;grid-row:2;height:28px}
/* A value being dragged: blue once the gateway hears it live, red if it stopped hearing it mid-drag. */
.setting output.live,.row .val.live{color:var(--blue)}.setting output.dropped,.row .val.dropped{color:var(--red)}
/* Motion scale is off while the hold-to-move pad is held. */
.setting.locked{opacity:.4}

/* The hold-to-move pad, with the grip gauge on its right: a vertical slide while held moves the grip. */
.pad{flex:1 1 0;min-height:150px;display:flex;align-items:stretch;border-radius:20px;border:2.5px solid var(--blue);background:#fff;color:var(--blue);touch-action:none;padding:0;text-align:center;overflow:hidden}
.pad-text{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 6px;font-weight:600;font-size:17px;line-height:1.15}
.pad-text small{font-weight:400;font-size:12px;line-height:1.25;color:var(--ink2)}
.pad.pending{background:var(--blue-wash)}
.pad.held{background:var(--blue);color:#fff}
.pad.held .pad-text small,.pad.held .gauge small{color:#dfe6f7}
.pad.dropped{border-color:var(--red);color:var(--red);background:#fff}
.gauge{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-left:1.5px solid var(--blue-wash)}
.pad.held .gauge{border-left-color:rgba(255,255,255,.3)}
.gauge small{font-size:11px;font-weight:400;color:var(--ink2);line-height:1}
.gauge b{font-size:13px;font-weight:600;line-height:1}
.gauge-bar{position:relative;flex:1;width:14px;border-radius:7px;background:var(--paper2);border:1px solid var(--rule);overflow:hidden}
.gauge-bar i{position:absolute;left:0;right:0;top:0;height:0;background:var(--blue)}
.pad.held .gauge-bar{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.45)}
.pad.held .gauge-bar i{background:#fff}
.gauge.off{opacity:.45}

/* Drive: Marionette's spring-return stick, as large a circle as its cell allows, with turn and lift holds under it. */
/* Any spare height goes above the stick, so it stays next to the turn buttons, nearest the thumb. */
.stick-cell{flex:1 1 0;min-height:150px;container-type:size;display:grid;place-items:end center}
.stick{position:relative;width:100%;aspect-ratio:1;width:min(100cqw,100cqh);border-radius:50%;background:#fff;border:1.5px solid var(--ink);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.stick.dragging{cursor:grabbing}
.stick svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stick .edge{position:absolute;font-size:11px;line-height:1;color:var(--ink2);pointer-events:none}
.stick .edge.n{top:7%;left:50%;transform:translateX(-50%)}.stick .edge.s{bottom:7%;left:50%;transform:translateX(-50%)}
.stick .edge.w{left:6%;top:50%;transform:translateY(-50%)}.stick .edge.e{right:6%;top:50%;transform:translateY(-50%)}
/* The knob is 30% of the pad and travels 35% of it, so a full push moves it 35/30 of its own size. */
.knob{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#fff;border:2.5px solid var(--blue);box-shadow:0 2px 6px rgba(46,48,51,.18);transition:transform .2s cubic-bezier(.3,1.35,.6,1);pointer-events:none}
.stick.dragging .knob{transition:none}
.stick.pending .knob{background:var(--blue-wash)}
.stick.live .knob{background:var(--blue)}
.stick.dropped{border-color:var(--red)}.stick.dropped .knob{border-color:var(--red);background:#fff}
.stick .vec{stroke:var(--blue)}.stick.dropped .vec{stroke:var(--red)}
.stick .off-note{display:none;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:14px;color:var(--ink2)}
.stick.off{border-color:var(--rule);background:var(--paper2);cursor:default}
.stick.off svg,.stick.off .edge,.stick.off .knob{display:none}
.stick.off .off-note{display:block}
.stick-row{display:flex;justify-content:center;height:160px;padding:4px 0 6px;container-type:size}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(360px + var(--bottom));max-width:min(92vw,400px);padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:15px;line-height:1.35;z-index:5}

/* Full-screen sheets: calibration and validation */
.sheet{position:fixed;top:0;bottom:0;left:50%;width:min(100%,430px);transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;padding-top:var(--top);
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;animation:rise .22s ease-out}
@keyframes rise{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:74px;padding:0 96px 0 18px}
.sheet-top b{font-weight:600;text-align:center}
.sheet-top b small{display:block;font-weight:400;font-size:14px;color:var(--ink2)}
.sheet-top .left{justify-self:start;color:var(--blue);min-height:44px}
.track{display:flex;gap:6px;padding:10px 20px 0}
.track span{flex:1;font-size:14px;color:var(--ink2);padding-top:9px;border-top:3px solid var(--rule)}
.track .done{border-color:var(--ink);color:var(--ink)}
.track .fail{border-color:var(--red);color:var(--red)}
.track .pass{border-color:var(--green);color:var(--green)}
.track .cur{border-color:var(--blue);color:var(--ink);font-weight:600}
.track .cur em{font-style:normal;background:linear-gradient(transparent 55%,var(--hi) 55%)}
.ill{display:block;width:100%;max-width:340px;height:auto;margin:6px auto 0}
.ill .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ill text{font-family:var(--hand);font-size:17px}
.sheet-body{padding:0 22px;flex:1;overflow-y:auto}
.title{font-size:31px;line-height:1.15;font-weight:600;letter-spacing:-.015em;margin:2px 0 8px}
.body{font-size:17px;line-height:1.45;color:var(--ink2);margin:0;max-width:32ch}
.meter{margin-top:20px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink2)}
.meter-top b{font-size:28px;color:var(--ink);font-weight:500}
.meter-bar{height:10px;border-radius:5px;background:var(--paper2);border:1px solid var(--rule);margin-top:8px;position:relative;overflow:hidden}
.meter-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue)}
.meter-bar s{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed var(--ink2)}
.meter.ready .meter-bar i{background:var(--green)}
.axes{margin-top:16px;display:grid;gap:10px}
.axis{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:10px;font-size:15px;color:var(--ink2)}
.axis b{font-weight:500;color:var(--ink);text-align:right}
.bar{display:block;height:4px;border-radius:2px;background:var(--rule);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px;left:50%;width:0}
.axis .bar{margin:0;height:8px;border-radius:4px}
.axis.lead{color:var(--ink)}
.axis.lead span{background:linear-gradient(transparent 55%,var(--hi) 55%)}
.reply{margin:16px 0 0;font-size:16px;line-height:1.4;color:var(--ink2)}
.reply.bad{color:var(--red)}
.results{list-style:none;margin:16px 0 0;padding:0}
.results li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:16px}
.sheet-foot{padding:12px 20px calc(16px + var(--bottom));display:grid;gap:10px}
.cta{height:60px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:18px}
.cta:disabled{background:var(--rule);color:var(--ink2)}
.cta.quiet{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.links{display:flex;justify-content:center;gap:24px;padding:4px 0 2px}
.links button{color:var(--blue);font-size:16px;min-height:40px}
.links button.danger{color:var(--red)}
.frame-status{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);margin-top:14px;font-size:16px}
.frame-status span{color:var(--ink2)}

/* Desktop preview: show a phone-width column */
@media (min-width:600px){
  html{background:#e9ebe6}
  .app{max-width:430px;margin:0 auto;box-shadow:0 0 0 1px var(--rule)}
  .stop{right:calc(50% - 215px + 12px)}
  body{background-color:#e9ebe6}
  .app{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.switch,.switch::after,.knob{transition:none}}
</style>
</head>
<body>
<div class="rule" id="me-rule" hidden></div>
<div class="app" id="app">
  <header class="strip">
    <span class="chip me" id="me-chip"><i class="dot" id="me-dot"></i><span id="me">Connecting…</span></span>
    <span class="chip" id="tracking-chip"><i class="dot" id="tracking-dot"></i><span id="tracking">Starting tracking</span></span>
    <div class="banner" id="estop-banner" role="alert" hidden>
      <b>Stop is on</b>
      <button type="button" id="estop-reset">Reset Stop</button>
    </div>
    <button type="button" class="chip more" id="more" aria-label="More: calibration, arm resets and the gateway">More</button>
  </header>
  <section class="pad-x">
    <h1 class="state" id="state">Connecting…</h1>
    <p class="note" id="state-note"></p>
    <div class="robot" id="robot"></div>
    <figure class="cam" id="cam" hidden></figure>
    <div class="seg views" id="views" role="group" aria-label="Cameras" hidden></div>
  </section>
  <section class="controls" id="controls">
    <div class="col" id="arm-col" aria-label="Arm">
      <div class="seg" id="arms" role="group" aria-label="Arm"></div>
      <div class="pair" id="grip-row">
        <button type="button" class="key" id="grip-open">Open gripper</button>
        <button type="button" class="key" id="grip-close">Close gripper</button>
      </div>
      <div class="setting" id="arm-setting" hidden></div>
    </div>
    <div class="col" id="drive-col" aria-label="Drive">
      <div class="stick-cell" id="stick-cell"></div>
      <div class="pair" id="turn-row"></div>
      <div class="pair" id="lift-row"></div>
      <div class="setting" id="drive-setting" hidden></div>
    </div>
  </section>
</div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
<!-- Stop sits above the page and every sheet, so it is always one tap away. -->
<button class="stop" id="stop" type="button" aria-label="Stop" hidden>Stop</button>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
  // Every control is found by its action. The grip slider (0 open, 1 closed) is driven by the pad slide and the
  // Open and Close buttons; the stick, turn and lift holds and the speed limit are the base's controls.
  const ACTION = {
    deadman: 'teleop.deadman', estop: 'safety.estop', arm: 'arm.select', view: 'camera.view', scale: 'teleop.translationScale', grip: 'gripper.set',
    drive: 'base.drive', turnLeft: 'base.turnLeft', turnRight: 'base.turnRight', liftUp: 'lift.up', liftDown: 'lift.down', speedLimit: 'base.speedLimit',
    start: 'calibration.start', capture: 'calibration.capture', cancel: 'calibration.cancel',
    check: 'calibration.check', origin: 'calibration.captureOrigin', clear: 'calibration.reset',
    resetLeft: 'arm.resetLeft', resetRight: 'arm.resetRight',
  };
  const DRIVE_HOLDS = [ACTION.turnLeft, ACTION.turnRight, ACTION.liftUp, ACTION.liftDown];
  // Status messages the consumer on Axol sends this phone: robot state at 5 Hz, and one-off notices. Each Axol
  // session stamps its feedback with its own sessionId, so two sessions answering within 2 s is a setup mistake.
  const FEEDBACK = 'axol.feedback', NOTICE = 'axol.notice', FEEDBACK_STALE_MS = 1500, SESSION_OVERLAP_MS = 2000;
  // Grip slide: 200 px is the full range and a few pixels of thumb wobble move nothing. After this phone sets
  // the grip, feedback that predates it is not adopted for a moment.
  const GRIP_FULL_PX = 200, GRIP_SLOP_PX = 6, GRIP_SETTLE_MS = 250;
  const STEPS = ['flat', 'forward', 'right', 'up'];
  const MOVES = ['forward', 'right', 'up'];
  // FLAT_DEG matches the gateway's FLAT_TOLERANCE_DEGREES.
  const MIN_MM = 30, TARGET_MM = 100, FLAT_DEG = 30;
  // Like the gateway: calibration is a rough axis alignment, so limited tracking is fine.
  const canCalibrate = (tracking, source) => source !== 'synthetic' && (tracking === 'normal' || tracking === 'limited');
  const STEP_COPY = {
    flat: { title: 'Hold it flat', body: 'Hold the phone in your hand, roughly flat, screen up, top edge pointing the way Axol faces.', cta: 'Capture flat' },
    forward: { title: 'Move it forward', body: 'Keep it roughly flat and move it straight ahead, about a hand’s length.', cta: 'Capture forward' },
    right: { title: 'Back, then move right', body: 'Return to the flat spot, then move straight to your right.', cta: 'Capture right' },
    up: { title: 'Back, then lift it', body: 'Return to the flat spot, then lift it straight up.', cta: 'Capture up' },

  const MOVE_COPY = {
    forward: { title: 'Move it forward', body: 'Bring it back to the flat spot, then move it straight ahead about 10 cm.' },
    right: { title: 'Move it right', body: 'Back at the flat spot, move it straight to your right about 10 cm.' },
    up: { title: 'Lift it up', body: 'Back at the flat spot, lift it straight up about 10 cm.' },

  // Operator frame (ROS REP-103): +X forward, +Y left, +Z up. Validation expects these signs.
  const EXPECTED = { forward: ['x', 1], right: ['y', -1], up: ['z', 1] };
  const AXIS_WORDS = { '+X': 'forward', '-X': 'back', '+Y': 'left', '-Y': 'right', '+Z': 'up', '-Z': 'down' };
  const TRACKING_WORDS = { normal: 'Tracking good', limited: 'Tracking limited', initializing: 'Starting tracking', relocalizing: 'Finding its place', unavailable: 'No tracking' };
  const REASON_NOTES = { excessiveMotion: 'Move a little slower.', insufficientFeatures: 'Point the camera at something with texture.', interrupted: 'Tracking was interrupted.', relocalizing: 'Hold still for a moment.', initializing: 'Move the phone gently to start.', synthetic: 'Simulated motion, not a real pose.' };

  const h = (tag, props = {}, ...children) => { const node = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (v === undefined || v === false) continue; if (k === 'class') node.className = v; else if (k.startsWith('on')) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v === true ? '' : v); } for (const child of children.flat()) if (child != null && child !== false) node.append(child); return node; };
  const setText = (node, text) => { if (node && node.textContent !== text) node.textContent = text; };
  const mm = v => Math.round(v * 1000);
  const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const cap = word => word ? word[0].toUpperCase() + word.slice(1) : '';
  const rotate = (q, v) => { const { x, y, z, w } = q; const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z; return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x }; };

  const control = action => s.config && s.config.controls.find(c => c.action === action);
  const byId = id => s.config && s.config.controls.find(c => c.id === id);
  const send = (c, value) => { if (c) window.Marionette.sendAction(c.id, c.action, value); };
  const calibration = () => (s.config ? s.config.calibration : { status: 'uncalibrated' });

  // can let go of all of it. `quiet` lets go here without sending, when the host has already ended it (a lost gateway).
  const letGos = new Set();
  const letGoAll = quiet => { for (const letGo of [...letGos]) letGo(quiet === true); };
  window.addEventListener('blur', () => letGoAll());
  document.addEventListener('visibilitychange', () => { if (document.hidden) letGoAll(); });
  const disposeAll = group => { while (group.length) group.pop()(); };
  const rowHolds = [], dockHolds = [], driveHolds = [], settingHolds = { 'arm-setting': [], 'drive-setting': [] };

  // Hold-to-act: true on press, false on release. The app repeats the press while it is held and the gateway drops a hold whose renewals stop.
  // The release goes to the control that was pressed, even if the config changed in between, and
  // `dispose` releases before the button is removed so a rebuilt dock can never leave a hold behind.
  // Hold buttons pressed on this screen: control id → whether the gateway has reported the hold during this press.
  const pressed = new Map();
  // idle; pending (pressed, not yet reported by the gateway); held; or dropped (the gateway let go, e.g. its repeats stopped
  // arriving, while it is still pressed here; a repeat never restarts a hold, so the operator has to press again).
  // Without a gateway connection nothing is held, whatever the last config said.
  const holdState = c => !c || !pressed.has(c.id) ? 'idle' : s.connection && s.connection.state === 'disconnected' ? 'dropped' : c.held ? 'held' : pressed.get(c.id) ? 'dropped' : 'pending';
  /** Returns a function that releases the hold. */
  function holdable(node, getControl, onChange, group) {

  // Sliders and sticks being dragged here: control id → whether the gateway has reported the stream during this drag.
  const touching = new Map();
  // idle; pending (dragged, not yet reported live); live; or dropped (the gateway stopped hearing it while it is still
  // dragged here; like a hold, it only counts again once the operator lets go).
  const liveState = c => !c || !touching.has(c.id) ? 'idle' : s.connection && s.connection.state === 'disconnected' ? 'dropped' : c.live ? 'live' : touching.get(c.id) ? 'dropped' : 'pending';
  // The bridge's stream sends the newest value at most once a frame, marked live; `end` sends the final value.
  // The host repeats the latest sample every 50 ms while the stream is open, so a resting finger stays live.
  function dragger(getControl) {

      end(value, quiet) { if (!stream) return; if (quiet !== true) stream.end(value); stream = undefined; touching.delete(id); renderLive(); },

  // A slider streams while dragged; letting go (or a key press) sends the final value.

  // each -1..1 and at most 1 together. A touch pushes it that far from the centre and it follows the finger until let go.
  const KNOB_TRAVEL = 35 / 30 * 100;

    const face = svg('<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="35" fill="none" stroke="#cfd3d6" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/><path d="M50 3V97M3 50H97" stroke="#e6ebf2" vector-effect="non-scaling-stroke"/><line class="vec" x1="50" y1="50" x2="50" y2="50" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>');

    const drag = dragger(getControl); let rect, pointer, pushed = false; const keys = new Set();

  }
  // Every live control shows what the gateway knows, like the hold buttons.
  function renderLive() {
    if (!s.config) return;

  }

  /* ---------- Robot feedback ---------- */
  // The latest axol.feedback values while they are fresh; the consumer sends them at 5 Hz.
  const feedback = () => s.feedback && Date.now() - s.feedback.at < FEEDBACK_STALE_MS ? s.feedback.values : undefined;
  // Two Axol sessions on one gateway (a sim and the robot, say) answer this phone in turn; nothing they say can be trusted.
  function twoSessions() { const now = Date.now(); for (const [id, at] of s.sessions) if (now - at > SESSION_OVERLAP_MS) s.sessions.delete(id); return s.sessions.size > 1; }

  // Another phone has this phone's arm: the consumer ignores this phone's grip, so the grip controls are off.
  const otherOwner = () => { const f = feedback(); return f && typeof f.owner === 'string' && f.owner && f.owner !== myName() ? f.owner : ''; };

    const values = message.values || {};
    s.sessions.set(typeof message.sessionId === 'string' ? message.sessionId : '', Date.now());
    s.feedback = { values, at: Date.now() };
    adoptGrip(values.grip);
    renderRobot(); renderHeadline(); renderDriveDock(); renderGripControls(); renderCamera();
  }
  // Feedback that stops arriving turns into "No answer from Axol", and a second session's warning clears, without waiting for another message.
  setInterval(() => { const watch = !!feedback() + ':' + twoSessions(); if (watch === s.watch) return; s.watch = watch; renderRobot(); renderHeadline(); renderGripControls(); }, 250);
  // A short calibration state for the tags, so "Not calibrated" is always in view.
  function calibrationTag() {
    const cal = calibration(); const check = cal.check;
    if (cal.status === 'capturing') return ['Calibrating', 'warn'];
    if (cal.status !== 'captured') return ['Not calibrated', 'warn'];

    return [check && check.passed === true ? 'Validated' : 'Calibrated', 'ok'];

    const key = JSON.stringify(tags); if (box.dataset.key === key) return; box.dataset.key = key;
    box.replaceChildren(...tags.map(([text, tone, kind]) => kind === 'calibration'

      : h('span', { class: 'tag ' + tone }, text)));

  /* ---------- Status strip, Stop, headline ---------- */
  // Stop is this phone's own signal: a toggle the consumer reads. Marionette itself stops nothing.

    const conn = s.connection, t = s.tracking, me = s.config && s.config.phone; const connected = !!conn && conn.state === 'connected';

    $('me-chip').className = 'chip me' + (connected && (!me || me.connected !== false) ? '' : ' off');
    $('me-dot').className = 'dot' + (me ? '' : connected ? ' good' : ' bad'); $('me-dot').style.background = me ? me.color : '';
    const rule = $('me-rule'); rule.hidden = !me; rule.style.background = me ? me.color : '';
    const offline = !!me && me.connected === false; const state = offline ? 'unavailable' : t ? t.state : 'initializing';
    setText($('tracking'), offline ? 'No pose' : t && t.source === 'synthetic' ? 'Simulated motion' : TRACKING_WORDS[state] || state);
    $('tracking-dot').className = 'dot ' + (state === 'normal' && (!t || t.source !== 'synthetic') ? 'good' : state === 'unavailable' ? 'bad' : 'warn');
    $('stop').hidden = !control(ACTION.estop);

  function renderHeadline() {
    const c = s.config, t = s.tracking, conn = s.connection, f = feedback(), me = myName(); const pad = holdState(control(ACTION.deadman));

    const turning = stickState !== 'idle' || holds.slice(0, 2).some(x => x !== 'idle'), lifting = holds.slice(2).some(x => x !== 'idle');

    return `<path class="line" stroke="${color}" stroke-width="2.4" d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} M${wing(0.45)} L${x2.toFixed(1)} ${y2.toFixed(1)} L${wing(-0.45)}"/>` + (label ? `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="${color}">${label}</text>` : '');
  }
  const TARGET = { forward: [70, 0, 0], right: [0, 70, 0], up: [0, 0, 70] };
  function scene(kind) {
    const table = `<path class="line" stroke="#9aa1a6" stroke-width="1.4" d="${poly([[-70, -110, 0], [-70, 110, 0], [115, 110, 0], [115, -110, 0]])}"/>`;
    let marks = '';
    if (kind === 'flat') marks = arrow([40, 0, 0], [100, 0, 0], 'var(--red)', 'forward', [104, -6, 0]) + arrow([0, -20, 0], [0, -84, 0], 'var(--green)', 'left', [0, -124, 6]) + arrow([0, 0, 0], [0, 0, 84], 'var(--blue)', 'up', [0, 8, 86]);
    else {
      const target = TARGET[kind];
      marks = `<path class="line" stroke="#6b6f73" stroke-width="1.4" stroke-dasharray="4 5" d="${phoneShape(...target)}"/>`;
      if (kind === 'up') marks = `<path class="line" stroke="#cfd3d6" stroke-width="1.2" stroke-dasharray="2 4" d="${phoneShape(0, 0, 0)}"/>` + marks;
      marks += arrow([0, 0, 0], kind === 'up' ? [0, 0, 56] : kind === 'right' ? [0, 52, 0] : [52, 0, 0], 'var(--blue)', kind, kind === 'up' ? [0, -54, 60] : kind === 'right' ? [-14, 76, 0] : [60, 26, 0]);
    }
    const note = kind === 'flat' ? 'top edge points forward, screen up' : '';
    return `<svg class="ill" viewBox="0 0 340 230" role="img" aria-label="${kind}">
      <defs><filter id="pencil"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
      <g filter="url(#pencil)">${table}</g>
      <g id="live-phone"><path class="line" id="live-body" stroke="#2e3033" stroke-width="2" fill="#fff" d="${phoneShape(0, 0, 0)}"/><path id="live-screen" fill="#e9edf2" d="${screenShape(0, 0, 0)}"/><path class="line" id="live-slot" stroke="#2e3033" stroke-width="2" d="${slotShape(0, 0, 0)}"/></g>
      <g filter="url(#pencil)">${marks}</g>
      ${note ? `<text x="20" y="220" fill="#6b6f73" style="font-size:15px">${note}</text>` : ''}
    </svg>`;
  }
  function placePhone(f, r, u) { const body = $('live-body'); if (!body) return; body.setAttribute('d', phoneShape(f, r, u)); $('live-screen').setAttribute('d', screenShape(f, r, u)); $('live-slot').setAttribute('d', slotShape(f, r, u)); }

  function sheetMode() {
    const cal = calibration();
    if (cal.status === 'capturing') return 'capture';
    if (cal.check && cal.check.step) return 'validate';
    return s.sheet;
  }
  function openSheet(mode = 'intro') { s.sheet = mode; s.reply = undefined; renderSheet(true); }
  function closeSheet() { s.sheet = undefined; s.reply = undefined; renderSheet(true); }
  let sheetKey = '';
  function renderSheet(force) {
    const mode = sheetMode(); const sheet = $('sheet'); const cal = calibration();
    // The gateway drives capture and validation, so a run started from the desktop opens the sheet here too.
    if ((mode === 'capture' || mode === 'validate') && s.sheet !== mode) {
      // A run started elsewhere waits until the operator lets go of the pad before covering the screen.
      if (s.padHeld && !s.sheet) { $('sheet').hidden = true; return; }
      s.sheet = mode;
    }
    $('app').inert = !!mode;
    if (!mode) { disposeAll(rowHolds); sheet.hidden = true; sheet.replaceChildren(); sheetKey = ''; return; }
    // The sheet covers the docks, so nothing stays pressed or dragged underneath it.
    letGoAll();
    sheet.hidden = false;
    const key = JSON.stringify([mode, cal.status, cal.step, cal.check, cal.reference && cal.reference.epoch, s.reply, control(ACTION.check) && 1, control(ACTION.origin) && 1, control(ACTION.clear) && 1, mode === 'more' ? moreKey() : '']);
    if (!force && key === sheetKey) { renderSheetLive(); renderRows(); return; }
    sheetKey = key; disposeAll(rowHolds);
    sheet.replaceChildren(...{ intro, capture, captured, validate, validated, more }[mode]());
    renderSheetLive(); renderRows();
  }
  // The right side of the bar is left clear for the floating Stop button.
  const top = (left, title, count, onLeft) => h('div', { class: 'sheet-top' }, h('button', { type: 'button', class: 'left', onclick: onLeft }, left), h('b', {}, title, count ? h('small', {}, count) : null), h('span'));
  const svg = markup => { const box = h('div'); box.innerHTML = markup; return box.firstElementChild; };
  const reply = () => s.reply ? h('p', { class: 'reply' + (s.reply.bad ? ' bad' : ''), role: 'status' }, s.reply.text) : null;

  function intro() {
    const cal = calibration(); const [summary, tone] = calibrationSummary();
    const calibrated = cal.status === 'captured';
    return [
      top('Close', 'Calibration', '', closeSheet),
      svg(scene('flat')),
      h('div', { class: 'sheet-body' },
        h('h2', { class: 'title' }, calibrated ? 'Calibrated' : 'Set which way is forward'),
        h('p', { class: 'body' }, 'Stand behind Axol, facing the way it faces. Then make four short moves with the phone: flat, forward, right and up. It takes about a minute.'),
        h('div', { class: 'frame-status' }, h('span', {}, 'Now using'), h('b', { class: tone }, summary === 'Not calibrated' ? 'The phone’s start position' : summary)),
        reply()),
      h('div', { class: 'sheet-foot' },
        control(ACTION.start) && h('button', { type: 'button', class: 'cta', onclick: () => { s.reply = undefined; send(control(ACTION.start)); } }, calibrated ? 'Calibrate again' : 'Start calibration'),
        calibrated && control(ACTION.check) && h('button', { type: 'button', class: 'cta quiet', onclick: () => { s.reply = undefined; send(control(ACTION.check)); } }, 'Validate calibration'),
        h('div', { class: 'links' },
          control(ACTION.origin) && h('button', { type: 'button', onclick: () => send(control(ACTION.origin)) }, 'Set origin here'),
          calibrated && control(ACTION.clear) && h('button', { type: 'button', class: 'danger', onclick: () => send(control(ACTION.clear)) }, 'Reset calibration'))),
    ];
  }
  function stepTrack(list, current, done) { return h('div', { class: 'track' }, list.map(name => { const state = done(name); return h('span', { class: name === current ? 'cur' : state || '' }, name === current ? h('em', {}, cap(name)) : cap(name) + (state === 'pass' ? ' ✓' : state === 'fail' ? ' ✗' : '')); })); }
  function capture() {
    const cal = calibration(); const step = cal.step || 'flat'; const index = STEPS.indexOf(step);
    const copy = STEP_COPY[step];
    return [
      top('Cancel', 'Calibrate', (index + 1) + ' of 4', () => { send(control(ACTION.cancel)); closeSheet(); }),
      stepTrack(STEPS, step, name => STEPS.indexOf(name) < index ? 'done' : ''),
      svg(scene(step)),
      h('div', { class: 'sheet-body' },
        h('h2', { class: 'title' }, copy.title), h('p', { class: 'body' }, copy.body),
        h('div', { class: 'meter', id: 'meter' }, h('div', { class: 'meter-top' }, h('span', { id: 'meter-label' }), h('span', {}, h('b', { id: 'meter-value' }), h('span', { id: 'meter-unit' }))), h('div', { class: 'meter-bar' }, h('i', { id: 'meter-fill' }), h('s', { id: 'meter-tick' })), h('p', { class: 'note', id: 'meter-note' })),
        reply()),
      h('div', { class: 'sheet-foot' }, h('button', { type: 'button', class: 'cta', id: 'cta', onclick: () => send(control(ACTION.capture), step) }, copy.cta)),
    ];
  }
  function captured() {
    return [
      top('Close', 'Calibrate', '', closeSheet),
      svg(scene('flat')),
      h('div', { class: 'sheet-body' }, h('h2', { class: 'title' }, 'Calibrated'), h('p', { class: 'body' }, 'Forward, left and up now follow how you held the phone.'), reply()),
      h('div', { class: 'sheet-foot' },
        h('button', { type: 'button', class: 'cta', onclick: closeSheet }, 'Done'),
        control(ACTION.check) && h('button', { type: 'button', class: 'cta quiet', onclick: () => { s.reply = undefined; send(control(ACTION.check)); } }, 'Validate calibration')),
    ];
  }
  const resultState = move => { const r = (calibration().check || { results: [] }).results.find(x => x.move === move); return r ? (r.passed ? 'pass' : 'fail') : ''; };
  function validate() {
    const check = calibration().check; const move = check.step; const index = MOVES.indexOf(move);
    return [
      top('Cancel', 'Validate', (index + 1) + ' of 3', () => { send(control(ACTION.check), 'cancel'); closeSheet(); }),
      stepTrack(MOVES, move, resultState),
      svg(scene(move)),
      h('div', { class: 'sheet-body' },
        h('h2', { class: 'title' }, MOVE_COPY[move].title), h('p', { class: 'body' }, MOVE_COPY[move].body),
        h('div', { class: 'axes', id: 'axes' }, [['x', 'forward', 'var(--red)'], ['y', 'left', 'var(--green)'], ['z', 'up', 'var(--blue)']].map(([axis, word, color]) =>
          h('div', { class: 'axis', id: 'axis-' + axis }, h('span', {}, word), h('span', { class: 'bar' }, h('i', { id: 'axis-bar-' + axis, style: 'background:' + color })), h('b', { id: 'axis-val-' + axis })))),
        h('p', { class: 'note', id: 'axes-note' }),
        reply()),
      h('div', { class: 'sheet-foot' }, h('button', { type: 'button', class: 'cta', id: 'cta', onclick: () => send(control(ACTION.check), move) }, 'Check ' + move)),
    ];
  }
  function validated() {
    const check = calibration().check || { results: [] }; const passed = check.passed;
    const failed = check.results.filter(r => !r.passed);
    return [
      top('Close', 'Validate', '', closeSheet),
      stepTrack(MOVES, undefined, resultState),
      h('div', { class: 'sheet-body' },
        h('h2', { class: 'title' + (passed ? ' ok' : ' bad') }, passed ? 'Validated ✓' : 'That didn’t line up'),
        h('p', { class: 'body' }, passed ? 'Forward, right and up each moved along the axis they should.' : failed.map(r => cap(r.move) + ' went ' + AXIS_WORDS[r.dominant] + '.').join(' ') + ' Calibrate again and keep each move straight.'),
        h('ul', { class: 'results' }, check.results.map(r => { const d = r.displacement; const along = Math.round(Math.hypot(d.x, d.y, d.z) * 1000); return h('li', {}, h('span', {}, cap(r.move)), h('span', { class: r.passed ? 'ok' : 'bad' }, AXIS_WORDS[r.dominant] + ' (' + r.dominant.replace('-', '−') + '), ' + along + ' mm ' + (r.passed ? '✓' : '✗'))); }))),
      h('div', { class: 'sheet-foot' },
        h('button', { type: 'button', class: 'cta', onclick: passed ? closeSheet : () => { s.reply = undefined; send(control(ACTION.start)); } }, passed ? 'Done' : 'Calibrate again'),
        !passed && h('button', { type: 'button', class: 'cta quiet', onclick: closeSheet }, 'Not now')),
    ];
  }

  // Live parts of the sheet, updated with every pose.
  function renderSheetLive() {
    const mode = sheetMode(); const p = s.pose; const cal = calibration();
    const tracking = s.tracking ? s.tracking.state : (p ? p.trackingState : 'initializing');
    const usable = canCalibrate(tracking, s.tracking ? s.tracking.source : p && p.source);
    const cta = $('cta');
    if (cta) cta.disabled = !usable;
    if (mode === 'capture' && p) {
      const step = cal.step || 'flat'; const a = cal.anchor; const v = p.position;
      let label = 'Moved', value = 0, unit = ' mm of ' + TARGET_MM, ready = false, note = '', progress = 0;
      if (step === 'flat') {
        const screen = screenDirection(p); const tilt = Math.round(Math.acos(clamp(screen.z, -1, 1)) * 180 / Math.PI);
        label = 'Tilt'; value = tilt; unit = '°'; ready = tilt <= FLAT_DEG; progress = 1 - clamp(tilt / 90, 0, 1);
        note = ready ? 'Flat enough. Capture when ready.' : 'Hold it flatter, screen up.';
        placePhone(0, 0, 0);
      } else if (a) {
        const d = { x: v.x - a.x, y: v.y - a.y, z: v.z - a.z };
        if (step === 'up') { value = mm(d.z); placePhone(0, 0, clamp(value * 0.7, 0, 110)); }
        else if (step === 'right' && s.forwardAt) {
          // Right is measured across the forward direction just captured, so leftover forward travel does not count.
          const f = { x: s.forwardAt.x - a.x, y: s.forwardAt.y - a.y }; const len = Math.hypot(f.x, f.y) || 1; const fx = f.x / len, fy = f.y / len;
          value = mm(d.x * fy - d.y * fx); const along = mm(d.x * fx + d.y * fy);
          if (Math.abs(along) > 40) note = 'Go back to the flat spot first.';
          placePhone(clamp(along * 0.7, -60, 110), clamp(value * 0.7, -90, 110), 0);
        } else { value = mm(Math.hypot(d.x, d.y)); placePhone(step === 'forward' ? clamp(value * 0.7, 0, 110) : 0, step === 'right' ? clamp(value * 0.7, 0, 110) : 0, 0); }
        ready = value >= MIN_MM; progress = clamp(value / TARGET_MM, 0, 1);
        if (!note) note = ready ? 'That’s enough. Capture when steady.' : MIN_MM + ' mm is enough to capture.';
      }
      if (!usable) note = 'Waiting for tracking.';
      // A blind camera barely registers the move, so say why the meter is stuck.
      else if (tracking === 'limited' && step !== 'flat' && !ready) note = 'Tracking is limited. Hold the phone up so the camera sees the room.';
      setText($('meter-label'), label); setText($('meter-value'), String(value)); setText($('meter-unit'), unit);
      $('meter-fill').style.width = (progress * 100).toFixed(1) + '%';
      const tick = $('meter-tick'); tick.hidden = step === 'flat'; tick.style.left = (MIN_MM / TARGET_MM * 100) + '%';
      $('meter').className = 'meter' + (ready ? ' ready' : ''); setText($('meter-note'), note);
    }
    if (mode === 'validate' && p) {
      const move = cal.check.step; const v = p.position; const lead = dominant(v); const [expectAxis, expectSign] = EXPECTED[move];
      for (const axis of ['x', 'y', 'z']) {
        const n = mm(v[axis]); const fraction = clamp(n / 150, -1, 1) * 50; const bar = $('axis-bar-' + axis);
        bar.style.left = (fraction < 0 ? 50 + fraction : 50) + '%'; bar.style.width = Math.abs(fraction) + '%';
        setText($('axis-val-' + axis), signed(n)); $('axis-' + axis).className = 'axis' + (lead[1].toLowerCase() === axis ? ' lead' : '');
      }
      const travel = Math.round(Math.hypot(v.x, v.y, v.z) * 1000);
      const good = lead === (expectSign > 0 ? '+' : '-') + expectAxis.toUpperCase();
      setText($('axes-note'), !usable ? 'Waiting for tracking.' : travel < MIN_MM ? 'Start from the flat spot.' : good ? 'Moving ' + AXIS_WORDS[lead] + ', ' + travel + ' mm.' : travel + ' mm ' + AXIS_WORDS[lead] + ' of the flat spot. Go back to it first.');
      // The drawn phone follows the calibrated position, so a wrong frame shows up as the phone sliding the wrong way.
      placePhone(clamp(v.x * 700, -60, 110), clamp(-v.y * 700, -100, 110), clamp(v.z * 700, -10, 110));
    }
  }

  /* ---------- Bridge wiring ---------- */
  const boot = () => {
    const M = window.Marionette; if (!M || boot.done) return; boot.done = true;
    M.on('connection', c => {
      s.connection = c;
      // The host ends every hold and drag when the gateway goes, so they are let go here without sending,
      // and each needs a fresh touch once it is back.
      if (c.state !== 'connected') letGoAll(true);
      renderStrip(); renderHeadline(); renderRows(); renderHolds(); renderLive();
    });
    M.on('tracking', t => { s.tracking = t; renderStrip(); renderHeadline(); if (s.sheet) renderSheetLive(); });
    M.on('camera_frame', m => {
      const view = cameraView(); if (!view || view.streams.indexOf(m.cameraId) < 0) return;
      const pane = $('cam').querySelector('[data-stream="' + CSS.escape(m.cameraId) + '"]'); if (!pane) { renderCamera(); return; }
      pane.querySelector('img').src = m.dataUrl; const fresh = Date.now() - (frameAt[m.cameraId] || 0) >= 2000; frameAt[m.cameraId] = Date.now(); if (fresh) renderCamera();
    });
    let posePending = false;
    M.on('pose', p => { s.pose = p; if (posePending || !s.sheet) return; posePending = true; requestAnimationFrame(() => { posePending = false; renderSheetLive(); }); });
    M.on('config', c => {
      const before = s.config ? s.config.calibration : undefined; const wasStopped = stopOn(); s.config = c; const cal = c.calibration;
      // Turning Stop on lets go of everything, so resetting it never starts the arm or base again by itself.
      if (!wasStopped && stopOn()) letGoAll();
      for (const id of pressed.keys()) { const x = byId(id); if (x && x.held) pressed.set(id, true); }
      for (const id of touching.keys()) { const x = byId(id); if (x && x.live) touching.set(id, true); }
      // Until Axol answers, the grip starts from this phone's own last value.
      if (!feedback()) { const g = control(ACTION.grip); if (g && g.type === 'slider') adoptGrip(g.value); }
      // Remember where the phone was when forward was captured, to measure the right step across it.
      if (before && before.step === 'forward' && cal.step === 'right' && s.pose) s.forwardAt = s.pose.position;
      if (cal.status !== 'capturing') s.forwardAt = undefined;
      if (before && before.status === 'capturing' && cal.status === 'captured' && s.sheet === 'capture' && cal.reference && (!before.reference || before.reference.epoch !== cal.reference.epoch)) s.sheet = 'captured';
      else if (before && before.status === 'capturing' && cal.status !== 'capturing' && s.sheet === 'capture') s.sheet = undefined;
      if (before && before.check && before.check.step && cal.check && cal.check.passed !== undefined) s.sheet = 'validated';
      else if (before && before.check && before.check.step && !(cal.check && cal.check.step) && s.sheet === 'validate') s.sheet = undefined;
      if (before && (before.step !== cal.step || (before.check && before.check.step) !== (cal.check && cal.check.step))) s.reply = undefined;
      renderStrip(); renderArms(); renderHeadline(); renderRobot(); renderSettings(); renderDock(); renderDriveDock(); renderCamera(); renderViews(); renderSheet(); renderLive();
    });
    M.on('status', m => {
      // Robot state from the consumer on Axol: shown in the headline and tags, never as a toast.
      if (m.controlId === FEEDBACK) { onFeedback(m); return; }
      if (m.controlId === NOTICE) { if (m.message) toast(m.message); return; }
      const c = s.config; const from = m.controlId && c && c.controls.find(x => x.id === m.controlId);
      // Every gateway reply says whether it did what was asked; a refusal is shown where the operator is looking.
      const refused = !!(m.values && m.values.accepted === false);
      if (from && (from.action === ACTION.capture || from.action === ACTION.check)) { s.reply = refused ? { text: m.message, bad: true } : undefined; renderSheet(); return; }
      if (from && (from.action === ACTION.start || from.action === ACTION.origin || from.action === ACTION.clear || from.action === ACTION.cancel)) { if (s.sheet === 'intro') { s.reply = { text: m.message, bad: refused }; renderSheet(); } else if (!s.sheet) toast(m.message); return; }
      if (!m.message || m.message === 'Connected to Marionette gateway') return;
      toast(m.message);
    });
  };
  if (window.Marionette) boot(); else window.addEventListener('marionette-ready', boot, { once: true });
})();
</script>
